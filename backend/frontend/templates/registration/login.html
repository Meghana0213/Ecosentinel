<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Login
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #061324,
        #0b2440
    );

    overflow-y:auto;

    padding:40px 0;
}

.login-container{

    width:420px;

    padding:45px;

    border-radius:28px;

    background:
    rgba(10,20,40,0.92);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.4);
}

.title{

    text-align:center;

    color:white;

    font-size:34px;

    font-weight:700;

    margin-bottom:12px;
}

.subtitle{

    text-align:center;

    color:#94a3b8;

    margin-bottom:35px;
}

label{

    display:block;

    color:#dbeafe;

    margin-bottom:10px;

    font-size:14px;

    font-weight:500;
}

input{

    width:100%;

    padding:16px;

    border:none;

    outline:none;

    border-radius:14px;

    background:#10253d;

    color:white;

    font-size:15px;

    margin-bottom:20px;
}

button{

    width:100%;

    padding:17px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;
}

.register-link{

    text-align:center;

    margin-top:25px;

    color:#94a3b8;
}

.register-link a{

    color:#22c55e;

    text-decoration:none;

    font-weight:600;
}

</style>

</head>

<body>

<div class="login-container">

    <h1 class="title">

        Welcome Back

    </h1>

    <p class="subtitle">

        Login to continue

    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">

            Login

        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a href="/register/">

            Register

        </a>

    </div>

</div>

</body>

</html>
