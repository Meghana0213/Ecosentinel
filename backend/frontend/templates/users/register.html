<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
AI Smart Waste - Register
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #061324,
        #0b2440
    );

    overflow-y:auto;

padding:40px 0;
}

.bg-circle{

    position:absolute;

    width:400px;

    height:400px;

    border-radius:50%;

    background:
    rgba(34,197,94,0.15);

    top:-100px;

    right:-100px;

    filter:blur(30px);
}

.bg-circle2{

    position:absolute;

    width:300px;

    height:300px;

    border-radius:50%;

    background:
    rgba(59,130,246,0.12);

    bottom:-80px;

    left:-80px;

    filter:blur(30px);
}

.register-container{

    width:420px;

    padding:45px;
    margin:40px 0;

    border-radius:28px;

    background:
    rgba(10,20,40,0.92);

    backdrop-filter:blur(20px);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.4);

    border:
    1px solid rgba(255,255,255,0.08);

    position:relative;

    z-index:10;
}

.logo{

    text-align:center;

    font-size:50px;

    margin-bottom:10px;
}

.title{

    text-align:center;

    color:white;

    font-size:32px;

    font-weight:700;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#94a3b8;

    margin-bottom:35px;

    font-size:14px;
}

form p{

    margin-bottom:22px;
}

label{

    display:block;

    color:#dbeafe;

    margin-bottom:10px;

    font-size:14px;

    font-weight:500;
}

input{

    width:100%;

    padding:16px;

    border:none;

    outline:none;

    border-radius:14px;

    background:#10253d;

    color:white;

    font-size:15px;

    transition:0.3s;
}

input:focus{

    border:
    2px solid #22c55e;

    box-shadow:
    0 0 15px rgba(34,197,94,0.3);
}

.helptext{

    display:block;

    color:#94a3b8;

    font-size:12px;

    margin-top:8px;
}

ul{

    color:#ef4444;

    margin-top:8px;

    font-size:13px;

    padding-left:18px;
}

button{

    width:100%;

    padding:17px;

    border:none;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #16a34a
    );

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

    margin-top:15px;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 25px rgba(34,197,94,0.35);
}

.login-link{

    text-align:center;

    margin-top:25px;

    color:#94a3b8;

    font-size:14px;
}

.login-link a{

    color:#22c55e;

    text-decoration:none;

    font-weight:600;
}

.footer{

    text-align:center;

    margin-top:30px;

    color:#64748b;

    font-size:12px;
}

</style>

</head>

<body>

<div class="bg-circle"></div>

<div class="bg-circle2"></div>

<div class="register-container">

    <div class="logo">
        ♻️
    </div>

    <h1 class="title">
        Create Account
    </h1>

    <p class="subtitle">
        AI Driven Smart Waste Monitoring & Collection System
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">

            Register Account

        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="/login/">

            Login

        </a>

    </div>

    <div class="footer">

        Smart City AI Platform © 2026

    </div>

</div>

</body>

</html>
